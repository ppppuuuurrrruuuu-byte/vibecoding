<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>할 일 목록</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #222;
    --sub: #888;
    --accent: #5b6cff;
    --border: #e4e6eb;
    --done: #b3b6c0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1d22;
      --card: #26272e;
      --text: #eee;
      --sub: #999;
      --accent: #7c8bff;
      --border: #3a3b42;
      --done: #55565f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 20px;
    text-align: center;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  button {
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 15px;
    padding: 0 18px;
    cursor: pointer;
  }
  button:active { opacity: 0.8; }
  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    justify-content: center;
  }
  .filters button {
    background: transparent;
    color: var(--sub);
    border: 1px solid var(--border);
    padding: 6px 14px;
    font-size: 13px;
    border-radius: 20px;
  }
  .filters button.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  li {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  li .check {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--accent);
  }
  li.done .check {
    background: var(--accent);
    color: white;
  }
  li span.text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
    cursor: pointer;
  }
  li.done span.text {
    color: var(--done);
    text-decoration: line-through;
  }
  li .del {
    background: transparent;
    color: var(--sub);
    padding: 4px 8px;
    font-size: 16px;
  }
  .empty {
    text-align: center;
    color: var(--sub);
    font-size: 14px;
    margin-top: 30px;
  }
  .footer {
    text-align: center;
    color: var(--sub);
    font-size: 12px;
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>📝 할 일 목록</h1>
  <div class="input-row">
    <input type="text" id="todoInput" placeholder="할 일을 입력하세요" maxlength="200">
    <button id="addBtn">추가</button>
  </div>
  <div class="filters">
    <button data-filter="all" class="active">전체</button>
    <button data-filter="active">진행중</button>
    <button data-filter="done">완료</button>
  </div>
  <ul id="list"></ul>
  <div class="empty" id="emptyMsg" style="display:none;">할 일이 없어요</div>
  <div class="footer" id="counter"></div>
</div>

<script>
const STORAGE_KEY = 'vibecoding_todos';
let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let filter = 'all';

const listEl = document.getElementById('list');
const inputEl = document.getElementById('todoInput');
const emptyMsg = document.getElementById('emptyMsg');
const counter = document.getElementById('counter');

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
}

function render() {
  listEl.innerHTML = '';
  const filtered = todos.filter(t => {
    if (filter === 'active') return !t.done;
    if (filter === 'done') return t.done;
    return true;
  });

  filtered.forEach(todo => {
    const li = document.createElement('li');
    li.className = todo.done ? 'done' : '';

    const check = document.createElement('div');
    check.className = 'check';
    check.textContent = todo.done ? '✓' : '';
    check.onclick = () => { todo.done = !todo.done; save(); render(); };

    const span = document.createElement('span');
    span.className = 'text';
    span.textContent = todo.text;
    span.onclick = () => { todo.done = !todo.done; save(); render(); };

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.onclick = () => { todos = todos.filter(t => t.id !== todo.id); save(); render(); };

    li.appendChild(check);
    li.appendChild(span);
    li.appendChild(del);
    listEl.appendChild(li);
  });

  emptyMsg.style.display = filtered.length === 0 ? 'block' : 'none';
  const doneCount = todos.filter(t => t.done).length;
  counter.textContent = todos.length ? `총 ${todos.length}개 · 완료 ${doneCount}개` : '';
}

function addTodo() {
  const text = inputEl.value.trim();
  if (!text) return;
  todos.push({ id: Date.now(), text, done: false });
  inputEl.value = '';
  save();
  render();
}

document.getElementById('addBtn').onclick = addTodo;
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') addTodo();
});

document.querySelectorAll('.filters button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filter = btn.dataset.filter;
    render();
  };
});

render();
</script>
</body>
</html>
